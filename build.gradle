plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'thin'
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
        rename { 'LICENSE-neoopencomputers.txt' }
    }
    from(rootProject.file('LICENSE-luaj')) {
        into 'META-INF'
        rename { 'LICENSE-luaj.txt' }
    }
    from(rootProject.file('LICENSE-typesafe')) {
        into 'META-INF'
        rename { 'LICENSE-typesafe-config.txt' }
    }
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from sourceSets.main.allSource
    from sourceSets.main.output
    include 'li/cil/oc/api/**'
}

tasks.named('javadoc', Javadoc).configure {
    include 'li/cil/oc/api/**'
    options.addBooleanOption('Xdoclint:none', true)
    options.quiet()
}

tasks.register('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    dependsOn tasks.named('javadoc')
    from tasks.named('javadoc')
}

tasks.named('assemble').configure {
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('apiJar')
    dependsOn tasks.named('javadocJar')
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        if (project.hasProperty('neoopencomputers.quickPlayWorld')) {
            argument '--quickPlaySingleplayer'
            argument project.property('neoopencomputers.quickPlayWorld').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

tasks.register('syncGameTestStructures', Sync) {
    def sourceDir = layout.projectDirectory.dir('gameteststructures')
    def outputDir = layout.projectDirectory.dir('run/gameTestServer/gameteststructures')
    from sourceDir
    into outputDir
}

tasks.register('generateEmptyGameTestStructure') {
    def emptyStructure = layout.projectDirectory.file('run/gameTestServer/gameteststructures/empty.snbt')
    outputs.file emptyStructure
    doLast {
        def output = emptyStructure.asFile
        if (!output.exists()) {
            output.parentFile.mkdirs()
            output.text = '''{
  DataVersion: 3955,
  size: [4, 3, 3],
  entities: [],
  blocks: [],
  palette: [{Name: "minecraft:air"}]
}
'''
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructures')
    dependsOn tasks.named('generateEmptyGameTestStructure')
}

tasks.named('generateEmptyGameTestStructure') {
    mustRunAfter tasks.named('syncGameTestStructures')
}
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    api 'com.typesafe:config:1.4.3'
    jarJar('com.typesafe:config:1.4.3') {
        version {
            strictly '[1.4.3,1.5)'
            prefer '1.4.3'
        }
    }
    jarJar(implementation('org.luaj:luaj-jse:3.0.1')) {
        version {
            strictly '[3.0.1,3.1)'
            prefer '3.0.1'
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

runs {
    configureEach {
        dependencies {
            runtime 'org.luaj:luaj-jse:3.0.1'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn tasks.named('apiJar')
    dependsOn tasks.named('jar')
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('javadocJar')
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')
    systemProperty 'neoopencomputers.apiJar', tasks.named('apiJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'neoopencomputers.modJar', tasks.named('jarJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'neoopencomputers.allJar', tasks.named('jarJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'neoopencomputers.javadocJar', tasks.named('javadocJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'neoopencomputers.mavenPom', layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile.absolutePath
}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact tasks.named('apiJar')
            artifact tasks.named('javadocJar')

            pom {
                name = mod_name
                description = 'Java-first NeoForge port of OpenComputers for Minecraft 1.21.1.'
                url = 'https://github.com/ThEWiZ76/NeoOpenComputers'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                        distribution = 'repo'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ThEWiZ76/NeoOpenComputers.git'
                    developerConnection = 'scm:git:https://github.com/ThEWiZ76/NeoOpenComputers.git'
                    url = 'https://github.com/ThEWiZ76/NeoOpenComputers'
                }
            }
        }
    }
    repositories {
        maven {
            url = uri(layout.buildDirectory.dir('repo'))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
