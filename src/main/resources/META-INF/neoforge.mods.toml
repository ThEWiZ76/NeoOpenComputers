modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ThEWiZ76/NeoOpenComputers/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ThEWiZ76/NeoOpenComputers"
credits="Based on MightyPirates/OpenComputers."
authors="NeoOpenComputers community"
description='''
NeoOpenComputers is a community-maintained Java-first NeoForge port of
OpenComputers for Minecraft 1.21.1.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="projectred_core"
    type="optional"
    versionRange="[4.23.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="projectred_transmission"
    type="optional"
    versionRange="[4.23.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    type="optional"
    versionRange="[1.120.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.2.18,20)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="enderstorage"
    type="optional"
    versionRange="[2.13.0.191,2.14)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="enderio"
    type="optional"
    versionRange="[8.2.12-beta,9)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="railcraft"
    type="optional"
    versionRange="[1.2.13,1.3)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="forestry"
    type="optional"
    versionRange="[3.0.0-alpha8,4)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tis3d"
    type="optional"
    versionRange="[2.0.0,3)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
